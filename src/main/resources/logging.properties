# Respaldo declarativo del logging (JUL).
# La configuracion efectiva en produccion la aplica
# infrastructure.logging.LoggingConfig de forma programatica,
# porque en StartMode=exe las JvmOptions de procrun no llegan al proceso hijo.
# Este archivo solo se usa si alguien lo referencia con
# -Djava.util.logging.config.file (modo jvm o ejecucion manual).
handlers=java.util.logging.ConsoleHandler
.level=INFO
java.util.logging.ConsoleHandler.level=INFO
java.util.logging.ConsoleHandler.formatter=java.util.logging.SimpleFormatter
java.util.logging.SimpleFormatter.format=%1$tF %1$tT %4$s: %2$s: %5$s%6$s%n
